# Ajustes de construcción del sitio, versionados junto al código.
# Netlify los lee de aquí en cada despliegue: no hay que configurarlos a mano
# en el tablero, y si algún día cambian, el cambio queda en la historia de git.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 5 pide Node 18 o más nuevo. Se fija la versión para que la
  # construcción de hoy y la de dentro de dos años den lo mismo.
  NODE_VERSION = "20"

# Mudanza de dirección.
#
# Los dos sitios —el viejo y el nuevo— se construyen de este mismo
# repositorio, así que la regla va condicionada al dominio: solo se dispara
# cuando la petición llega a la dirección anterior. El sitio viejo conserva
# su despliegue continuo y no hay nada que mantener a mano.
#
# 301 es permanente y :splat conserva la ruta, así que /ayuda del viejo
# llega a /ayuda del nuevo. Va antes que todo lo demás.
[[redirects]]
  from = "https://panel-de-clases.netlify.app/*"
  to = "https://pauta-docente.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://panel-de-clases.netlify.app/*"
  to = "https://pauta-docente.netlify.app/:splat"
  status = 301
  force = true

# Guía de uso, independiente del panel: /ayuda.html vive en public/ y Netlify
# ya la sirve tal cual porque el archivo existe; este alias solo da una URL
# limpia. Debe ir antes del comodín de abajo.
[[redirects]]
  from = "/ayuda"
  to = "/ayuda.html"
  status = 200

# El panel es una sola página: cualquier otra ruta devuelve el mismo archivo.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
